[project]
name = "paper-checker-backend"
version = "0.1.0"
description = "Local thesis format checker backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<2.11",
    "sqlalchemy>=2.0,<2.1",
    "python-docx==1.1.2",
    "python-multipart>=0.0.20,<0.1",
    "uvicorn[standard]>=0.34,<0.35",
    "reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
