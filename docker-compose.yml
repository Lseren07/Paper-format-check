name: paper-checker

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      APP_NAME: paper-checker
      APP_ENV: production
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
      PAPER_RULES_DIR: /app/rules
      PAPER_RULES_DEFAULT: default
      REPORT_FONT_PATH: /usr/share/fonts/truetype/noto/NotoSansSC-Regular.ttf
      MAX_UPLOAD_SIZE_MB: "50"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
